spring.application.name=expense-tracker-api

# H2 in-memory DB for local dev
spring.datasource.url=jdbc:h2:mem:expensetrackerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true

# JWT settings - secret is a placeholder
app.jwt.secret=CHANGE_ME_local_dev_only_secret_key_at_least_256_bits_long_placeholder
app.jwt.expiration-ms=3600000

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
