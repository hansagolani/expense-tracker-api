spring.application.name=expense-tracker-api

# H2 in-memory DB for local dev
spring.datasource.url=jdbc:h2:mem:expensetrackerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true

# JWT settings
# replace before deploying anywhere real - override via env vars before deploying
# never commit a production secret
app.jwt.secret=G+PAfeaq/LQlBZP6glK9JQdue97P4svpb42s3UK6DOg=
app.jwt.expiration-ms=3600000

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Admin account for local dev/demo
